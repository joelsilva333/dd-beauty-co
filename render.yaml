# Blueprint do Render para o servidor de tempo real (socket.io).
# O site Next.js fica na Vercel; só a pasta /realtime corre aqui.
services:
  - type: web
    name: dd-beauty-realtime
    runtime: node
    rootDir: realtime
    # Plano gratuito: adormece após ~15 min de inatividade e corta as ligações
    # abertas (o tempo real volta a funcionar assim que alguém acede de novo).
    # Quando houver orçamento, trocar para "starter" para evitar essa quebra.
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: REALTIME_SECRET
        sync: false # a mesma chave definida na Vercel
      - key: ALLOWED_ORIGINS
        sync: false # ex: https://deodaliadias.co.ao,https://www.deodaliadias.co.ao
